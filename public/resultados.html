<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Resultados · Levantamento de IA</title>
<style>
  :root { --bg:#f4f7f6; --card:#fff; --ink:#1f2937; --mut:#6b7280; --line:#dfe6e4; --brand:#0e9f94; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1716; --card:#172321; --ink:#e5eceb; --mut:#93a3a0; --line:#2a3b38; --brand:#2cc3b6; } }
  * { box-sizing: border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width: 1100px; margin:0 auto; padding:24px 16px 80px; } h1 { margin:0 0 4px; font-size:24px; } .mut { color:var(--mut); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:16px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; } .card span { display:block; color:var(--mut); font-size:13px; } .card b { font-size:22px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; overflow-x:auto; } h2 { margin:0 0 10px; font-size:16px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; } th,td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; } th { color:var(--mut); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; } .n { text-align:right; } tr.tot td { font-weight:700; border-top:2px solid var(--line); }
  details { border-bottom:1px solid var(--line); padding:8px 0; } summary { cursor:pointer; } .fe { margin:8px 0 8px 14px; padding-left:12px; border-left:3px solid var(--brand); } .fe p { margin:3px 0; }
  a.btn { display:inline-block; background:var(--brand); color:#fff; text-decoration:none; padding:9px 16px; border-radius:9px; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Levantamento de uso e custo de IA</h1>
  <p class="mut">Resultados recebidos. Valores como informados pelas pessoas; nada foi ajustado.</p>
  <div class="cards">{{CARDS}}</div>
  <section><h2>Custo por ferramenta e mês</h2>{{PIVOT}}</section>
  <section><h2>Respostas</h2>{{DETALHE}}</section>
  <p><a class="btn" href="{{CSV}}">Baixar tudo em CSV (Excel)</a></p>
</div>
</body>
</html>
